<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIO Södermalm | Öppnar snart</title>
  <meta name="description" content="DIO Södermalm — italienskt kök och bar mitt på Medborgarplatsen. Öppnar snart. Lämna din mejl så hör vi av oss.">
  <!-- TILLFÄLLIGT: förhandsvisning på GitHub Pages. TA BORT raden nedan
       innan sidan går live på riktig domän — annars indexeras den aldrig. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000E02">
  <meta property="og:title" content="DIO Södermalm | Öppnar snart">
  <meta property="og:description" content="En ny mötesplats mitt på Medborgarplatsen. Öppnar snart.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000E02'/%3E%3Cg fill='none' stroke='%23EFEDE3' stroke-width='3'%3E%3Cpath d='M14 20h6a11 11 0 0 1 0 22h-6z'/%3E%3Cpath d='M32 20v22'/%3E%3Ccircle cx='45' cy='31' r='11'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============================================================
       DIO SÖDERMALM — startsida före öppning
       Hero med loggan, sedan mejlanmälan. Alexander ville inte ha
       "Om oss" och "Hitta hit" — texterna där var ändå platshållare,
       och adress och öppettider är inte spikade. Ramverket står kvar:
       nya sektioner läggs in på samma sätt när menyn och bilderna kommer.
       ============================================================ -->

  <header class="topbar">
    <a class="topbar-logo" href="#top" aria-label="DIO Södermalm">
      <!-- Liten variant av märket: bara D I O, utan ortsnamnet. -->
      <svg class="mark" viewBox="0 0 596 213" fill="none" aria-hidden="true">
        <g stroke="currentColor" stroke-width="9">
          <path d="M4.5 4.5 H93.5 A102 102 0 0 1 93.5 208.5 H4.5 Z"/>
          <path d="M289.5 4.5 V208.5"/>
          <ellipse cx="487" cy="106.5" rx="104.5" ry="102"/>
        </g>
      </svg>
    </a>
    <nav class="topbar-nav" aria-label="Sidnavigering">
      <a href="#anmalan">Håll dig uppdaterad</a>
    </nav>
  </header>

  <main id="top">

    <!-- ---------- Hero ---------- -->
    <section class="hero">
      <div class="hero-glow" aria-hidden="true"></div>

      <div class="hero-inner">
        <p class="eyebrow">Medborgarplatsen · Stockholm</p>

        <!-- Loggan ritad som geometriska former, samma konstruktion som
             originalet: D är ett rakt ben med en halvcirkel, I en linje och
             O en liggande ellips. Måtten är uppmätta ur Alexanders
             logotypbild och satta i förhållande till versalhöjden 213:
             linjebredd 9, D-bredd 200, O-bredd 218, mellanrum 85 resp 84.
             Ren SVG, alltså knivskarp i alla storlekar och oberoende av
             vilka typsnitt som laddas. -->
        <h1 class="logo">
          <svg class="logo-svg" viewBox="0 0 596 295" fill="none" role="img" aria-labelledby="logo-title">
            <title id="logo-title">DIO Södermalm</title>
            <g stroke="currentColor" stroke-width="9">
              <path d="M4.5 4.5 H93.5 A102 102 0 0 1 93.5 208.5 H4.5 Z"/>
              <path d="M289.5 4.5 V208.5"/>
              <ellipse cx="487" cy="106.5" rx="104.5" ry="102"/>
            </g>
            <text class="logo-sub" x="298" y="287" text-anchor="middle"
                  font-size="40" letter-spacing="14.8" fill="currentColor">SÖDERMALM</text>
          </svg>
        </h1>

        <p class="hero-line">Öppnar snart</p>

        <a class="btn" href="#anmalan">Meddela mig när ni öppnar</a>
      </div>
    </section>

    <!-- ---------- Anmälan ---------- -->
    <section class="section signup-section" id="anmalan">
      <div class="signup-wrap">
        <h2>Först in genom dörren</h2>
        <p class="sub">
          Lämna din mejl så hör vi av oss när vi öppnar — inget annat,
          inga utskick däremellan.
        </p>

        <!-- Formuläret postar till api/anmal.php. Skriptet längst ner
             skickar i bakgrunden när JavaScript finns; utan JavaScript
             postar webbläsaren på vanligt vis och servern skickar
             tillbaka hit med ?anmalan=ok i adressen. Båda vägarna
             fungerar, ingen adress går förlorad. -->
        <form class="signup" action="api/anmal.php" method="post" novalidate>
          <label class="sr-only" for="mail">Din mejladress</label>
          <input id="mail" type="email" name="email" placeholder="din@mejl.se"
                 autocomplete="email" required>

          <!-- Honungsfälla: dold för besökare, men enkla spamrobotar fyller
               i allt de hittar. Är fältet ifyllt sparar servern ingenting. -->
          <div class="honung" aria-hidden="true">
            <label for="webbplats">Lämna det här fältet tomt</label>
            <input id="webbplats" name="webbplats" type="text" tabindex="-1" autocomplete="off">
          </div>

          <button type="submit">Skicka</button>
          <p class="form-msg" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <!-- ---------- Jobba hos oss ---------- -->
    <section class="hiring">
      <p>
        Vill du jobba med oss? Kontakta
        <a href="mailto:alexander@diosodermalm.se">alexander@<wbr>diosodermalm.se</a>
      </p>
    </section>

  </main>

  <footer class="site-footer">
    <p>© 2026 DIO Södermalm</p>
    <nav>
      <a href="mailto:alexander@diosodermalm.se">Mejl</a>
      <a href="https://www.instagram.com/dio.sodermalm/" target="_blank" rel="noopener">Instagram</a>
    </nav>
  </footer>

  <script>
    /* ---------- Sektioner tonar in vid scroll ---------- */
    (function () {
      var items = document.querySelectorAll('.section');
      if (!('IntersectionObserver' in window)) {
        items.forEach(function (i) { i.classList.add('is-in'); });
        return;
      }

      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          entry.target.classList.add('is-in');
          io.unobserve(entry.target);
        });
      }, { threshold: 0.15 });

      items.forEach(function (i) { io.observe(i); });
    })();

    /* ---------- Formulär ----------
       Adressen kollas här för snabb återkoppling och sedan en gång till
       på servern — klientvalidering är bekvämlighet, aldrig skydd. */
    document.querySelectorAll('.signup').forEach(function (form) {
      var field = form.querySelector('input[type="email"]');
      var msg = form.querySelector('.form-msg');
      var knapp = form.querySelector('button');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var ok = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(field.value.trim());

        if (!ok) {
          form.classList.add('is-error');
          msg.textContent = 'Kontrollera mejladressen.';
          field.focus();
          return;
        }

        form.classList.remove('is-error');
        knapp.disabled = true;
        msg.textContent = 'Skickar …';

        fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        })
          .then(function (svar) { return svar.text(); })
          .then(function (text) {
            var data;
            /* Kommer det något annat än JSON tillbaka är det servern som
               inte svarar som den ska — då ska besökaren få en väg fram
               ändå, inte ett tyst misslyckande. */
            try {
              data = JSON.parse(text);
            } catch (e) {
              throw new Error('Vi når inte servern just nu. Mejla oss på alexander@diosodermalm.se så lägger vi upp dig.');
            }
            if (!data.ok) {
              throw new Error(data.meddelande || 'Något gick fel. Försök igen om en stund.');
            }
            form.classList.add('is-done');
            msg.textContent = data.meddelande;
            field.value = '';
          })
          .catch(function (fel) {
            knapp.disabled = false;
            form.classList.add('is-error');
            msg.textContent = fel.message;
          });
      });

      field.addEventListener('input', function () {
        form.classList.remove('is-error');
        if (!form.classList.contains('is-done')) msg.textContent = '';
      });
    });

    /* Utan JavaScript postar formuläret på vanligt vis och servern skickar
       tillbaka hit. Då står utfallet i adressen — visa kvittot ändå. */
    (function () {
      var svar = new URLSearchParams(location.search).get('anmalan');
      if (!svar) return;

      var form = document.querySelector('.signup');
      var msg = form && form.querySelector('.form-msg');
      if (!msg) return;

      if (svar === 'ok') {
        form.classList.add('is-done');
        msg.textContent = 'Tack! Vi hör av oss när vi öppnar.';
      } else {
        form.classList.add('is-error');
        msg.textContent = 'Något gick fel. Försök igen om en stund.';
      }
    })();
  </script>

</body>
</html>
